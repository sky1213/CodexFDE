name: L08 Candidate Eval
on:
  push:
    branches: [codex/l08-a-false-green-8e8176af]
permissions:
  contents: read
jobs:
  blocking-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_REPORT_DIR: _ci_reports/${{ github.run_id }}-${{ github.run_attempt }}
      FLOWERP_PROJECT_ROOT: ${{ github.workspace }}/_projects/flowERP
      L08_PRODUCT_REPOSITORY: sky1213/flowERP
      L08_PRODUCT_SHA: d7493f4283d90d81838d44abc0a9832416d9f68b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a fixed independent product source
        shell: bash
        run: |
          [[ "$L08_PRODUCT_REPOSITORY" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]] || { echo 'Set L08_FLOWERP_REPOSITORY to owner/repository'; exit 1; }
          [[ "$L08_PRODUCT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Set L08_FLOWERP_SHA to the full product commit SHA'; exit 1; }
      - name: Checkout the frozen FlowERP candidate
        uses: actions/checkout@v4
        with:
          repository: sky1213/flowERP
          ref: d7493f4283d90d81838d44abc0a9832416d9f68b
          path: _projects/flowERP
          persist-credentials: false
          # For a private product repo, configure the authorized read secret:
          # token: ${{ secrets.L08_FLOWERP_READ_TOKEN }}
      # Course-construction tests require a pristine source to inject their own gap.
      # This baseline is NOT the business candidate under evaluation.
      - name: Checkout pristine baseline for course construction tests
        uses: actions/checkout@v4
        with:
          repository: sky1213/flowERP
          ref: 70660dd54cdd5acf4300d74aaad6f5d8c88121bc
          path: _projects/course-test-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare both project environments
        id: environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          python -m venv "$FLOWERP_PROJECT_ROOT/.venv"
          "$FLOWERP_PROJECT_ROOT/.venv/bin/python" -m pip install -e "$FLOWERP_PROJECT_ROOT"
          .venv/bin/python -X utf8 -m workbench.cli environment-check --product
          python -m venv _projects/course-test-baseline/.venv
          _projects/course-test-baseline/.venv/bin/python -m pip install -e _projects/course-test-baseline
          actual_product_sha="$(git -C "$FLOWERP_PROJECT_ROOT" rev-parse HEAD)"
          [[ "${actual_product_sha,,}" == "${L08_PRODUCT_SHA,,}" ]]
      - name: Record both versions and loaded check sources
        id: sources
        shell: bash
        run: |
          mkdir -p "$CI_REPORT_DIR"
          {
            printf 'course_test_baseline_sha='; git -C _projects/course-test-baseline rev-parse HEAD
            printf 'course_sha='; git rev-parse HEAD
            printf 'product_repository=%s\n' "$L08_PRODUCT_REPOSITORY"
            printf 'product_sha='; git -C "$FLOWERP_PROJECT_ROOT" rev-parse HEAD
            sha256sum eval/harness.py eval/cases.py
            .venv/bin/python -c 'import eval.harness; print("course_harness=" + eval.harness.__file__)'
            (
              cd "$FLOWERP_PROJECT_ROOT"
              .venv/bin/python -c 'import flowerp.service; print("product_service=" + flowerp.service.__file__)'
              if [[ -f eval/erp_cases.py ]]; then sha256sum eval/erp_cases.py; else sha256sum eval/cases.py; fi
            )
          } > "$CI_REPORT_DIR/source-versions.txt"
          cat "$CI_REPORT_DIR/source-versions.txt"
      - name: Unit tests
        env:
          FLOWERP_PROJECT_ROOT: ${{ github.workspace }}/_projects/course-test-baseline
        shell: bash
        run: |
          # Preserve unit-test failures.
          set +e
          .venv/bin/python -X utf8 -m unittest discover -s tests -v > "$CI_REPORT_DIR/unit.log" 2>&1
          original_exit=$?
          cat "$CI_REPORT_DIR/unit.log"
          printf "%s\n" "$original_exit" > "$CI_REPORT_DIR/unit-exit.txt"
          exit "$original_exit"
      - name: Workbench blocking gate
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.sources.outcome == 'success' }}
        shell: bash
        run: |
          # Preserve workbench failures.
          set +e
          .venv/bin/python -X utf8 -m eval.harness --suite blocking --no-report > "$CI_REPORT_DIR/workbench.log" 2>&1
          original_exit=$?
          cat "$CI_REPORT_DIR/workbench.log"
          printf "%s\n" "$original_exit" > "$CI_REPORT_DIR/workbench-exit.txt"
          exit "$original_exit"
      # Add every frozen personal business case with another --case argument.
      # The default blocking gate above does not execute product cases.
      - name: Explicit frozen business gate
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.sources.outcome == 'success' }}
        shell: bash
        run: |
          # Preserve the original business exit code and logs.
          set +e
          .venv/bin/python -X utf8 -m eval.harness --suite blocking --case sales_credit_and_atomic_reservation --report-path "$CI_REPORT_DIR/harness-blocking.json" > "$CI_REPORT_DIR/business.log" 2>&1
          original_exit=$?
          cat "$CI_REPORT_DIR/business.log"
          printf "%s\n" "$original_exit" > "$CI_REPORT_DIR/business-exit.txt"
          exit "$original_exit"
      - name: Verify business report consistency
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.sources.outcome == 'success' }}
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['CI_REPORT_DIR'])
          r = json.loads((p/'harness-blocking.json').read_text())
          original_exit = int((p/'business-exit.txt').read_text().strip())
          passed = original_exit == 0
          assert r['summary']['decision'] == ('pass' if passed else 'block')
          assert r['summary']['total'] == 1
          assert len(r['results']) == 1
          assert r['results'][0]['name'] == 'sales_credit_and_atomic_reservation'
          assert r['results'][0]['level'] == 'blocking'
          assert r['results'][0]['passed'] is passed
          PY
      - name: Bind report identity
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.sources.outcome == 'success' }}
        run: .venv/bin/python -X utf8 -m workbench.ci_evidence --report "$CI_REPORT_DIR/harness-blocking.json" --output "$CI_REPORT_DIR/ci-evidence.json"
      - name: Upload this attempt's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l08-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_REPORT_DIR }}/
          if-no-files-found: error
